# 운영(AWS) 환경 설정 - EC2에서 --spring.profiles.active=prod 로 기동
# 모든 값은 환경변수로 주입 (docs/deployment.md 참고)

server.port=8080

# MySQL (RDS)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:fds_db}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis (ElastiCache 또는 EC2 내 redis-server)
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}

# 로깅
logging.level.root=INFO
logging.level.com.fds=INFO
